# Builds the FITS webapp image from source and parks it in ECR as a deploy
# candidate. The running service follows the :latest tag, which this workflow
# never writes — promotion to :latest happens from Mission Control after a
# human approves the candidate, so a push here can never change what runs
# by itself. Full flow: aws-migration repo, docs/FITS_CICD_SPEC.md.
#
# The client and war are built with the same recipes cds-tcamt/Dockerfile
# uses, so a CI artifact matches a local `docker build` of that Dockerfile.
# Reimplementing the client build here is what broke it before. The client
# toolchain is pinned by cds-tcamt-client/package-lock.json; installing with
# --no-package-lock floated uglify-js from the locked 2.3.6 to 2.4.24, and
# 2.4.24 mis-mangles angular-moment-picker's isSelectable() — the outer
# $scope reference collides with the catch parameter, so every date picker
# threw "Cannot read properties of undefined (reading 'isAfterOrEqualMin')"
# and no calendar ever opened. Nothing in the build output said so, because
# `grunt build || grunt build --force` swallowed the cdnify abort too.

name: build-image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # lets the job assume the AWS role via OIDC; no stored keys
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPO: 708499050170.dkr.ecr.us-east-2.amazonaws.com/healthit/fits1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cds-tcamt
    steps:
      - uses: actions/checkout@v4

      # All Maven traffic goes through our Nexus (anonymous read). The
      # mirrorOf=* also overrides the hardcoded repository URLs some of
      # these poms still carry from their previous home — including the
      # sibling repos dependencies.sh builds from source.
      - name: maven settings
        working-directory: .
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>https://nexus.valitheus.com/repository/public/</url>
              </mirror>
            </mirrors>
            <!-- redefine central with snapshots enabled: several of our own
                 artifacts (fhirLib, the igamt-lite siblings) live in the
                 snapshots repo, and stock central would never ask for them -->
            <profiles>
              <profile>
                <id>nexus</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>nexus</activeProfile>
            </activeProfiles>
          </settings>
          XML

      # dependencies.json pins the sibling repos by SHA, so a change there
      # means different artifacts land in the repository.
      - name: cache maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml', 'cds-tcamt/cds-tcamt-controller/dependencies.json') }}
          restore-keys: m2-

      # package-lock.json governs the whole client toolchain (bower included),
      # so it belongs in the key.
      - name: cache client toolchain
        uses: actions/cache@v4
        with:
          path: .cache
          key: client-${{ hashFiles('cds-tcamt/cds-tcamt-client/package-lock.json', 'cds-tcamt/cds-tcamt-client/bower.json') }}
          restore-keys: client-

      # The DAP include reports usage to the federal analytics program and
      # has no place on our hosting. Strip it from the sources before the
      # client build so no build output can carry it.
      - name: strip analytics
        run: |
          for f in cds-tcamt-client/app/index.html cds-tcamt-client/app/prod/index.html; do
            sed -i -e '/dap\.digitalgov\.gov/d' \
                   -e '/googletagmanager\.com\/gtag/d' \
                   -e '/gtag-init/d' "$f"
          done
          if grep -RIl "digitalgov\|googletagmanager" cds-tcamt-client/app; then
            echo "analytics include still present after strip" >&2
            exit 1
          fi

      # Angular client, built exactly the way cds-tcamt/Dockerfile stage 1 and
      # dev/docker-compose-ui-compilation.yml build it: the dev image at
      # /etc/app running dev/in-container-compilation.sh. That image carries
      # the node 8 / compass / phantomjs / git-protocol-rewrite setup this
      # 2016-era toolchain needs, and the script's plain `npm install` honours
      # package-lock.json — which is what holds uglify-js at 2.3.6 and makes
      # this build reproduce the master artifact byte for byte (scripts.js and
      # main.css hash identically to the shipped nist775hit/fits-webapp image).
      # Do not add --no-package-lock here; see the header for what that broke.
      #
      # The cache mounts only save downloads; they are keyed by resolved
      # version, so the lockfile still decides what gets installed.
      - name: build client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/npm" "$GITHUB_WORKSPACE/.cache/bower"
          chmod +x dev/in-container-compilation.sh
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/etc/app" \
            -v "$GITHUB_WORKSPACE/.cache/npm:/root/.npm" \
            -v "$GITHUB_WORKSPACE/.cache/bower:/root/.cache/bower" \
            -w /etc/app \
            --entrypoint ./dev/in-container-compilation.sh \
            nist775hit/fits-dev-environment:latest
          test -f cds-tcamt-controller/src/main/webapp/index.html

      # War, exactly as cds-tcamt/Dockerfile stage 2 builds it. The dev image
      # cannot do this one: its default java is 11 and it has no jq.
      # build-with-dependencies.sh clones and builds hit-stats-logger, fhirLib
      # and cds-base at the SHAs dependencies.json pins, then runs
      # `mvn -f cds-tcamt-controller/pom.xml clean install` — so the backend
      # artifacts are the pinned sources rather than whatever sits in the
      # snapshots repo. The controller has no test sources, so the script's
      # unqualified `clean install` runs nothing extra.
      - name: build war
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src" \
            -v "$HOME/.m2/repository:/root/.m2/repository" \
            -v "$HOME/.m2/settings.xml:/root/.m2/settings.xml:ro" \
            -w /src eclipse-temurin:8-jdk bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends git maven jq
              chmod +x ./cds-tcamt-controller/dependencies.sh \
                       ./cds-tcamt-controller/build-with-dependencies.sh
              ./cds-tcamt-controller/build-with-dependencies.sh
            '
          # both containers ran as root, so their outputs — the built webapp,
          # the client's node_modules/bower_components, the war and the maven
          # repository — are root-owned on the host. Take them back before
          # anything else reads or caches them.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$HOME/.m2"

          WAR="$PWD/cds-tcamt-controller/target/fits.war"
          # the pom filters application.properties; if that regresses the
          # appInfo bean dies at startup on 'Unparseable date: "@timestamp@"'
          if unzip -p "$WAR" WEB-INF/classes/application.properties | grep -q '@version@\|@timestamp@'; then
            echo "maven did not filter application.properties" >&2
            exit 1
          fi
          # the war must not carry the analytics include
          if unzip -p "$WAR" index.html | grep -q "digitalgov\|googletagmanager"; then
            echo "analytics include made it into the war" >&2
            exit 1
          fi

      - name: aws login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::708499050170:role/healthit-prod-github-fits1
          aws-region: us-east-2

      - name: ecr login
        uses: aws-actions/amazon-ecr-login@v2

      - name: push candidate image
        run: |
          # The repo's own Dockerfile compiles everything inside the image
          # build (handy on a laptop, redundant here — the client and war are
          # already built above with its exact recipes). The image for
          # deployment is assembly-only: tomcat + error pages + the war + the
          # deployment branding, pinned at .github/docker/Dockerfile so changes
          # to the repo Dockerfile can't alter what ships. The context is the
          # repository root so the branding files under .github/docker/brand
          # are reachable; the root .dockerignore keeps everything else out.
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 \
            -f "$GITHUB_WORKSPACE/.github/docker/Dockerfile" \
            -t "$ECR_REPO:$SHA_TAG" -t "$ECR_REPO:candidate" --push "$GITHUB_WORKSPACE"
          echo "Pushed $ECR_REPO:$SHA_TAG (also tagged :candidate)."
          echo "Nothing is deployed yet — promote the candidate from Mission Control."
