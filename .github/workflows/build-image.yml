# Builds the FITS webapp image from source and parks it in ECR as a deploy
# candidate. The running service follows the :latest tag, which this workflow
# never writes — promotion to :latest happens from Mission Control after a
# human approves the candidate, so a push here can never change what runs
# by itself. Full flow: aws-migration repo, docs/FITS_CICD_SPEC.md.
#
# The client and war are built with the same recipes cds-tcamt/Dockerfile
# uses, so a CI artifact matches a local `docker build` of that Dockerfile.
# Reimplementing the client build here is what broke it before. The client
# toolchain is pinned by cds-tcamt-client/package-lock.json; installing with
# --no-package-lock floated uglify-js from the locked 2.3.6 to 2.4.24, and
# 2.4.24 mis-mangles angular-moment-picker's isSelectable() — the outer
# $scope reference collides with the catch parameter, so every date picker
# threw "Cannot read properties of undefined (reading 'isAfterOrEqualMin')"
# and no calendar ever opened. Nothing in the build output said so, because
# `grunt build || grunt build --force` swallowed the cdnify abort too.

name: build-image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # lets the job assume the AWS role via OIDC; no stored keys
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPO: 708499050170.dkr.ecr.us-east-2.amazonaws.com/healthit/fits1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cds-tcamt
    steps:
      - uses: actions/checkout@v4

      # All Maven traffic goes through our Nexus (anonymous read). The
      # mirrorOf=* also overrides the hardcoded repository URLs some of
      # these poms still carry from their previous home. The sibling
      # artifacts (hit-stats-logger, fhirLib, cds-base) are resolved from
      # here rather than built from source, so snapshots must stay enabled.
      - name: maven settings
        working-directory: .
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>https://nexus.valitheus.com/repository/public/</url>
              </mirror>
            </mirrors>
            <!-- redefine central with snapshots enabled: several of our own
                 artifacts (fhirLib, the igamt-lite siblings) live in the
                 snapshots repo, and stock central would never ask for them -->
            <profiles>
              <profile>
                <id>nexus</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>nexus</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: cache maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # dependencies.json pins the sibling artifacts built below, so
          # re-pinning one has to invalidate this cache
          key: m2-${{ hashFiles('**/pom.xml', 'cds-tcamt/cds-tcamt-controller/dependencies.json') }}
          restore-keys: m2-

      # Not every sibling artifact is published to Nexus, so hit-stats-logger,
      # fhirLib and cds-base are built from source here, in the order
      # cds-tcamt-controller/dependencies.json lists them and at the commit it
      # pins. That is the same file dependencies.sh reads, so adding or
      # re-pinning a dependency needs no change to this workflow. Each build
      # installs into the ~/.m2 cache above, where the war build picks it up;
      # anything not listed still resolves from Nexus. actions/checkout cannot
      # be looped, so this clones directly, and the builds run in the same
      # maven:3.9-eclipse-temurin-8 image as the war so they see the same JDK.
      - name: build dependencies from dependencies.json
        run: |
          set -euo pipefail
          rm -rf temp-dependencies && mkdir -p temp-dependencies
          jq -c '.dependencies[]' cds-tcamt-controller/dependencies.json | while read -r dep; do
            name=$(jq -r '.name' <<<"$dep")
            repository=$(jq -r '.repository' <<<"$dep")
            sha1=$(jq -r '.sha1' <<<"$dep")
            cmd=$(jq -r '.cmd' <<<"$dep")
            dir=$(basename "$repository" .git)

            echo "::group::$name ($repository @ $sha1)"
            git clone --quiet "$repository" "temp-dependencies/$dir"
            git -C "temp-dependencies/$dir" checkout --quiet "$sha1"
            # the json's cmd runs tests; CI only needs the artifacts installed
            docker run --rm \
              -v "$PWD/temp-dependencies:/src" \
              -v "$HOME/.m2/repository:/root/.m2/repository" \
              -v "$HOME/.m2/settings.xml:/root/.m2/settings.xml:ro" \
              -w "/src/$dir" maven:3.9-eclipse-temurin-8 \
              $cmd -B -DskipTests
            echo "::endgroup::"
          done
          # the container ran as root, so both the clones and the new ~/.m2
          # entries are root-owned on the host
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.m2/repository"
          sudo rm -rf temp-dependencies # keeps the runner (and docker context) clean

      # The DAP include reports usage to the federal analytics program and
      # has no place on our hosting. Strip it from the sources before the
      # client build so no build output can carry it.
      - name: strip analytics
        run: |
          for f in cds-tcamt-client/app/index.html cds-tcamt-client/app/prod/index.html; do
            sed -i -e '/dap\.digitalgov\.gov/d' \
                   -e '/googletagmanager\.com\/gtag/d' \
                   -e '/gtag-init/d' "$f"
          done
          if grep -RIl "digitalgov\|googletagmanager" cds-tcamt-client/app; then
            echo "analytics include still present after strip" >&2
            exit 1
          fi

      # Angular client, built exactly the way cds-tcamt/Dockerfile stage 1 and
      # dev/docker-compose-ui-compilation.yml build it: the dev image at
      # /etc/app running dev/in-container-compilation.sh. That image carries
      # the node 8 / compass / phantomjs / git-protocol-rewrite setup this
      # 2016-era toolchain needs, and the script's plain `npm install` honours
      # package-lock.json — which is what holds uglify-js at 2.3.6 and makes
      # this build reproduce the master artifact byte for byte (scripts.js and
      # main.css hash identically to the shipped nist775hit/fits-webapp image).
      # Do not add --no-package-lock here; see the header for what that broke.
      #
      # The cache mounts only save downloads; they are keyed by resolved
      # version, so the lockfile still decides what gets installed.
      - name: build client
        run: |
          # package-lock.json still carries bower-installer pinned to a git://
          # URL. It is not in package.json and no grunt task references it, but
          # npm walks the whole lockfile, and GitHub turned the git protocol off
          # in 2022, so the install dies on a port 9418 timeout. A working copy
          # that already has node_modules never reaches out for it, which is why
          # this only shows up on a clean runner. git's own insteadOf rewrite
          # does not help: npm spawns git in a way that bypasses it, proven on
          # an earlier run where the rewrite was in effect and a manual
          # ls-remote through it succeeded while npm's identical call still went
          # out on 9418. The commit is pinned by sha and is untouched, so the
          # resolved tree is the one the committed lockfile describes and only
          # the transport differs. The committed file is left alone so it stays
          # the reference the client toolchain is pinned by.
          sed -i 's|git://github.com/|git+https://github.com/|g' cds-tcamt-client/package-lock.json
          grep -q 'git+https://github.com/bessdsv/bower-installer.git#7f9cece1e6fada50f44dc0851e1d85815cd1b4a7' cds-tcamt-client/package-lock.json
          if grep -q 'git://' cds-tcamt-client/package-lock.json; then
            echo "a git:// URL survived the rewrite" >&2
            exit 1
          fi
          chmod +x dev/in-container-compilation.sh
          # Run it the way dev/docker-compose-ui-compilation.yml does: the
          # repository mounted at /etc/app and nothing else.
          #
          # The one thing a runner cannot reproduce on its own is ownership.
          # npm 6 running as root infers the owner of the package directory and
          # drops to that uid for its cache and for the git subprocesses it
          # spawns. On a laptop the bind mount presents as root-owned so npm
          # stays root; here the checkout belongs to the runner user, npm
          # demotes itself, and the install dies partway through cloning. The
          # npm_config_unsafe_perm and npm_config_cache knobs only moved the
          # failure, because the demotion also applies to the clone. Giving the
          # tree to root for the duration of the container is what actually
          # matches the environment the recipe was written for.
          sudo chown -R 0:0 .
          rc=0
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/etc/app" \
            -w /etc/app \
            --entrypoint ./dev/in-container-compilation.sh \
            nist775hit/fits-dev-environment@sha256:63168e288ada129f2c2ffe97cf967b0b1658dd14241ce073f35f35faf97ecdbd || rc=$?
          # hand the tree back whether or not the build worked, so a failed run
          # does not leave a workspace the next checkout cannot clean
          sudo chown -R "$(id -u):$(id -g)" .
          exit $rc
      - name: client artifact present
        run: test -f cds-tcamt-controller/src/main/webapp/index.html

      # War from the already-built webapp, resolving every dependency from
      # Nexus. Note the placeholder patching below is now a no-op: commit
      # 7f378ce fixed the duplicate unfiltered resource pass in the controller
      # pom, so maven already emits a real app.version/app.date. It is kept as
      # a belt-and-braces guard and costs nothing.
      - name: build war
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.m2/repository:/root/.m2/repository" \
            -v "$HOME/.m2/settings.xml:/root/.m2/settings.xml:ro" \
            -w /src/cds-tcamt-controller maven:3.9-eclipse-temurin-8 \
            mvn -B -DskipTests clean install
          # the container ran as root, so its outputs are root-owned on the
          # host — take them back before patching the war
          sudo chown -R "$(id -u):$(id -g)" cds-tcamt-controller/target
          # maven leaves these placeholders unfiltered; patch them inside the war
          V=$(grep -m1 "<version>" cds-tcamt-controller/pom.xml | sed 's/[^0-9.]*//g')
          rm -rf /tmp/warfix && mkdir -p /tmp/warfix
          unzip -o -q cds-tcamt-controller/target/fits.war WEB-INF/classes/application.properties -d /tmp/warfix
          sed -i -e "s/@timestamp@/$(date +%m-%d-%Y)/" -e "s/@version@/${V}/" /tmp/warfix/WEB-INF/classes/application.properties
          WAR="$PWD/cds-tcamt-controller/target/fits.war"
          (cd /tmp/warfix && zip -q "$WAR" WEB-INF/classes/application.properties)
          # the war must not carry the analytics include
          if unzip -p "$WAR" index.html | grep -q "digitalgov\|googletagmanager"; then
            echo "analytics include made it into the war" >&2
            exit 1
          fi

      - name: aws login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::708499050170:role/healthit-prod-github-fits1
          aws-region: us-east-2

      - name: ecr login
        uses: aws-actions/amazon-ecr-login@v2

      - name: push candidate image
        run: |
          # The repo's own Dockerfile compiles everything inside the image
          # build (handy on a laptop, redundant here — the client and war are
          # already built above with its exact recipe for the client). The image for
          # deployment is assembly-only: tomcat + error pages + the war + the
          # deployment branding, pinned at .github/docker/Dockerfile so changes
          # to the repo Dockerfile can't alter what ships. The context is the
          # repository root so the branding files under .github/docker/brand
          # are reachable; the root .dockerignore keeps everything else out.
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 \
            -f "$GITHUB_WORKSPACE/.github/docker/Dockerfile" \
            -t "$ECR_REPO:$SHA_TAG" -t "$ECR_REPO:candidate" --push "$GITHUB_WORKSPACE"
          echo "Pushed $ECR_REPO:$SHA_TAG (also tagged :candidate)."
          echo "Nothing is deployed yet — promote the candidate from Mission Control."
